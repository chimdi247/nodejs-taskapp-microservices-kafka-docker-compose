# NOTE: unlike Grafana's provisioning files, Alertmanager's config
# does NOT support ${VAR} environment-variable interpolation -- these
# values are literal and must be edited directly in this file (then
# `docker compose restart alertmanager`), not through .env. See
# observability/README.md.

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "chimdi247@gmail.com"
  smtp_auth_username: "chimdi247@gmail.com"
  smtp_auth_password: ""
  smtp_require_tls: true

route:
  receiver: email-alerts
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: email-alerts
      matchers:
        - severity = "critical"
      repeat_interval: 1h

receivers:
  - name: email-alerts
    email_configs:
      - to: "shimdi247@gmail.com"
        send_resolved: true

inhibit_rules:
  # A service being genuinely down produces noisy container-level
  # alerts for everything scheduled alongside it -- suppress those
  # once the higher-severity ServiceDown alert is already firing.
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - severity = "warning"
    equal: ["instance"]
