global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics exposed by the OpenTelemetry Collector.
  # Node services send OTLP metrics to the collector on :4317,
  # and the collector exposes Prometheus metrics on :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Per-container CPU/memory/network utilization.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host CPU/memory/disk utilization.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
